:`runasis`,label:`Run As-Is`,sections:[{id:`dayone`,label:`Day one: run as-is`,num:`07`},{id:`lanes-asis`,label:`People · Technology · Ops`,num:`08`},{id:`governance`,label:`Governance: two layers`,num:`09`}]},{id:`dial`,label:`The Dial`,sections:[{id:`dial-explorer`,label:`The 30-item dial`,num:`10`},{id:`walkthroughs`,label:`The dial in action`,num:`11`},{id:`goals`,label:`Your goals, covered`,num:`12`}]},{id:`journey`,label:`The Journey`,sections:[{id:`horizons`,label:`Horizons, re-anchored`,num:`13`},{id:`caution`,label:`The cost of caution`,num:`14`},{id:`proof`,label:`Why this is low-risk`,num:`15`},{id:`pandora`,label:`Your part`,num:`16`},{id:`start`,label:`How we start`,num:`17`}]}],Cd=Sd.flatMap(e=>e.sections),wd={kicker:`Pandora TS&F · Strategic Partner Selection 2027 · The requested alternative`,headline:`Same destination. A gentler on-ramp.`,question:`We would like to know if you can propose an alternative approach to the scope provided, as we found the current approach to be a bit ambitious.`,attribution:`Your message after the platform deep-dive`,ownership:`Thank you — this is exactly the right challenge, and a welcome one. In the deep dive we showed you the destination but not the road to it, so it read as if we would do all of it from day one. We are grateful for the chance to show the opposite.`,lede:`Here is the road we did not show. We run your platforms as they run today — your tools, your processes, your SLAs, the RFP's own transition plan — from day one. The agentic fabric stays exactly where you liked it: the destination. Everything below is how we travel there, step by earned step, at your pace and only ever through gates you control.`,oneLiner:`The fabric is never a dependency — only a dividend.`},Td=[{tag:`Lane 1`,title:`Run & Deliver`,role:`lane`,body:`Day-one as-is takeover on the RFP's own transition plan, tooling and SLAs. Zero change imposed on Pandora teams. Every scope item has a named conventional delivery path.`},{tag:`Lane 2`,title:`Improve & Evolve`,role:`lane`,body:`The agentic fabric as the continuous-improvement engine. It touches the estate only after readiness gates pass — one scope item at a time, with Pandora holding every dial.`},{tag:`Under both, from day one`,title:`Governance`,role:`base`,body:`Service governance live from day one. Agentic governance pre-built but dormant until the first dial-up. Controls always arrive before autonomy.`}],Ed=[[`Role of the agentic fabric`,`Delivery mechanism for scope`,`Continuous-improvement engine behind scope`],[`Scope coupling`,`13 of 30 scope rows delivered "via the fabric"`,`Zero scope rows depend on the fabric`],[`Day-1 change for Pandora teams`,`New Teams front door, new patterns`,`None — same tools, same processes`],[`Adoption decision`,`Program-level`,`Per scope item, per readiness gate, Pandora-held dial`],[`Governance on day 1`,`Agentic governance active`,`Service governance active; agentic governance dormant until first dial-up`],[`Prerequisites`,`Assumed ready`,`Assessed, then built inside Lane 1 — Gate 0 before anything agentic`],[`Benefits curve`,`Steeper, earlier`,`Slower start, same destination — the delta shown openly`]],Dd=`What does not change: the destination, the SLAs, the assets, the RFP commitments. The July approach remains available as the accelerated option — this alternative changes sequencing and coupling, nothing else.`,Od=[`Lane 1 meets every SLA using conventional means alone. Nothing agentic is ever load-bearing for an SLA until after it has passed its gate.`,`Nothing crosses into the estate without a passed readiness gate, a named Pandora owner's sign-off, and a proven rollback.`,`Every dial-up is reversible, and every dial position is reviewed quarterly inside the existing governance cadence.`],kd=[{id:`lane1`,name:`Lane 1 · Run & Deliver`,detail:`Transition, operations, migrations and platform engineering on Pandora's own tools and SLAs — the RFP delivered as written.`},{id:`lane2`,name:`Lane 2 · Improve & Evolve`,detail:`The agentic fabric — Teams front door, agentic SDLC, agentic ops — held ready, entering per item only through gates and dials.`}],Ad=`Before any agent acts in your estate, four things must already be true: the infrastructure and security posture can contain it, your people can supervise it, your operations can trace and measure it, and your governance can approve it. Lane 1 builds all four as a by-product of running the service well — which is why running as-is first is not a delay on the agentic journey. It is the journey's first leg.`,jd=`Agentic-first would not just have been ambitious — it would have been premature. The foundations must exist first, and most of them are already RFP scope.`,Md=[{id:`infra`,title:`Infrastructure & security maturity`,why:`An agent is only as safe as the estate that contains it.`,assess:`Joint security posture review in months 1–3: secrets and Key Vault hygiene, RBAC and network policy, environment isolation, audit-sink coverage, LLM gateway readiness.`,build:`Close the found gaps inside Lane 1; stand up the LLM gateway with policy, logging and cost controls. AI-ready is not AI-running — and AI-ready infrastructure is one of your own stated goals, so this is paid-for scope, not overhead.`,evidence:`Security sign-off · gateway live with policy, logging and cost controls · audit sink proven end to end.`},{id:`people`,title:`People & AI-tool fluency`,why:`Agents need supervisors before they need autonomy.`,assess:`Skills baseline against the RFP's own named gaps (Kubernetes, Kafka, DevOps fundamentals) plus an AI-tool usage baseline across teams.`,build:`Copilot and Claude enablement — tools Pandora has already approved, and one of your own stated goals — with prompt literacy, training paths and champions seeded in delivery teams.`,evidence:`Adoption and proficiency thresholds met (weekly-active share, certified cohort) · first Pandora-run retro on AI-assisted work.`},{id:`ops`,title:`Operations: trace & measure`,why:`You cannot gate agents on evidence you cannot measure.`,assess:`Observability baseline: tracing coverage, SLO coverage, runbook coverage, MTTA/MTTD/MTTR measurability, alert quality.`,build:`Dashboards, SLOs and runbooks to 95%+ coverage; baselines banked — DORA, developer NPS (16), cost, ticket volumes — during transition.`,evidence:`Trace-and-measure capability demonstrated on live incidents for a full quarter before any agentic ops discussion.`},{id:`governance`,title:`Governance readiness`,why:`Autonomy without an approval model is just risk.`,assess:`Decision-rights map, audit completeness check, risk appetite per domain — agreed with Security and Risk in the room.`,build:`Risk-tier model (T0–T4), the gate charter authored by Pandora hands in workshop W2, and decision records as standard practice.`,evidence:`Charter signed by named Pandora owners · audit completeness at threshold across a quarter of Lane-1 operations.`}],Nd={title:`Gate 0 — the foundations gate`,body:`Nothing agentic enters the estate until all four pillars show their evidence. Gate 0 is assessed jointly, passes once for the whole estate, and grants nothing automatically — it only makes dial-ups possible. It is the first of exactly three gate kinds: Gates 1 and 2 then pass per scope item. The dial stays in Pandora's hand.`},Pd=[{id:`g0`,name:`Gate 0 · Foundations`,scope:`Passes once, estate-wide`,unlocks:`Makes any dial-up possible at all`,evidence:`All four foundation pillars show their evidence: infra & security posture, people AI-fluency, ops trace-and-measure, governance readiness.`},{id:`g1`,name:`Gate 1 · Assist`,scope:`Passes per scope item`,unlocks:`L0 → L1 for that item`,evidence:`Named Pandora owner · audit on for the flow · human-approval path proven · rollback demonstrated.`},{id:`g2`,name:`Gate 2 · Agentic`,scope:`Passes per scope item`,unlocks:`L1 → L2 for that item`,evidence:`Assist track record at L1 · incident drill passed unaided · SLOs held · evaluation pass-rate at threshold.`}],Z=`Are more gates coming? No. Three gate kinds is the whole system: Gate 0 passes once for the estate; Gates 1 and 2 pass per item. Every gate has a named owner, written evidence criteria, and a reversible outcome — and no calendar date ever substitutes for a gate.`,Fd=[[`Lane 1 · Run & Deliver`,`The as-is managed service: your tools, your SLAs, the RFP delivered as written. Active from day one, never dependent on Lane 2.`],[`Lane 2 · Improve & Evolve`,`The agentic fabric, held ready. Enters the estate only through gates, one scope item at a time.`],[`L0 · L1 · L2`,`The three service levels on every scope item: run as-is · AI-assisted (human executes) · agentic (bounded loop behind approvals).`],[`Gate 0 · 1 · 2`,`The three gate kinds: foundations (once, estate-wide) · assist gate (per item, unlocks L1) · agentic gate (per item, unlocks L2).`],[`The dial`,`Each scope item's level setting. All 30 start at L0; only Pandora turns a dial, and only after the gates for that move have passed.`],[`Dial review`,`The quarterly 30-minute agenda item in existing governance where every dial position is confirmed, changed — or explicitly kept at "not yet".`]],Id=[{phase:`Phase I · Support team`,window:`Days 0–60 · Nov–Dec 2026`,detail:`Full support team hired in; on-parallel shadow of current teams; knowledge acquisition and tooling; handling P3–P5. Bi-weekly readiness assessments throughout.`},{phase:`Phase I · Autonomous`,window:`Day 60+ · from late Dec 2026`,detail:`Full on-call rotation live; P1/P2 ownership; monthly on-call quality evaluation against SLA/SLO.`},{phase:`Phase II · Dev team`,window:`Days 60–120 · Jan–Feb 2027`,detail:`Full dev teams hired in; shadow; knowledge handover; feature development and system operation.`},{phase:`Phase II · Autonomous`,window:`Day 120+ · from Mar 2027`,detail:`Proficient in all dev/ops tasks; proactively lifting quality and delivery efficiency; monthly performance review. Cutover on a 50+ parameter readiness assessment, agreed jointly on evidence.`}],Ld=[{label:`Tooling`,value:`Pandora's own table, unchanged: ServiceNow, New Relic, PagerDuty and GitHub (migrations in flight), Terraform, Jira/Confluence, Port.io.`},{label:`SLAs`,value:`The RFP's own numbers: P1 15-minute acknowledgement / 1.5h RTO · 99.99% mission-critical · error budgets per tier.`},{label:`RACI`,value:`The RFP boundary, unchanged: Pandora retains Lead and Senior Engineers, architecture, standards and roadmap; we run day-to-day.`},{label:`Migrations`,value:`Conventional migration factories: ADO→GitHub, OpsGenie→PagerDuty, Backstage→Port.io, and the BizTalk/EDW/Synapse strangler — playbooks, conversion tooling, cutover evidence.`},{label:`The only AI on day one`,value:`Inside our own delivery team (Claude, GitHub Copilot — tools Pandora already approved). It runs on our machines and pipelines, not in your estate, and needs no governance surface on your side.`}],Rd=[{id:`people`,title:`People — as-is first`,points:[`Day-one staffing is conventional roles per the RFP's resource asks — Kafka, Databricks, Kong, Kubernetes, Terraform engineers; DevOps and JS profiles — through the proven talent model: selection panels, buddy onboarding, quarterly talent reviews.`,`Enablement targets the RFP's named gaps (Kubernetes, Kafka, DevOps fundamentals) — valuable regardless of any agentic future.`,`Agent-supervisor skills, champions and a CoE are introduced only as dials turn.`],message:`No Pandora engineer's job changes on day one. Capability grows by invitation.`},{id:`technology`,title:`Technology — as-is first`,points:[`Conventional automation first: runbooks, golden paths, IaC, dashboards — the unglamorous 80% of the value.`,`Migrations as factories, not agents — wave plans, conversion playbooks, cutover evidence.`,`The fabric sits on the shelf, already built and proven — Pandav on a standard container, skills-as-files in Git, zero net-new infrastructure. Keeping the option open costs nothing.`],message:`We are not asking you to fund an
