e two-lane model`,num:`04`},{id:`foundations`,label:`Gate 0 in depth — readiness foundations`,num:`05`},{id:`landscape`,label:`Know the landscape`,num:`06`}]},{id:`runasis`,label:`Run As-Is`,sections:[{id:`dayone`,label:`Day one: run as-is`,num:`07`},{id:`transition-coverage`,label:`Transition coverage`,num:`08`},{id:`lanes-asis`,label:`People · Technology · Ops`,num:`09`},{id:`governance`,label:`Governance: two layers`,num:`10`}]},{id:`team`,label:`The Team`,sections:[{id:`team-shape`,label:`One team, three locations`,num:`11`},{id:`team-leader`,label:`One leader · Pandora in control`,num:`12`},{id:`team-converge`,label:`Why two teams? Dev & ops converge`,num:`13`},{id:`team-skills`,label:`Skills & knowledge transfer`,num:`14`},{id:`team-capacity`,label:`Capacity that compounds`,num:`15`}]},{id:`commercialsC`,label:`Commercials`,sections:[{id:`commercials`,label:`Commercial model`,num:`16`}]},{id:`dial`,label:`The Dial`,sections:[{id:`dial-explorer`,label:`The 30-item dial`,num:`17`},{id:`walkthroughs`,label:`The dial in action`,num:`18`},{id:`goals`,label:`Your goals, covered`,num:`19`}]},{id:`journey`,label:`The Journey`,sections:[{id:`horizons`,label:`Horizons, re-anchored`,num:`20`},{id:`caution`,label:`The cost of caution`,num:`21`},{id:`proof`,label:`Why this is low-risk`,num:`22`},{id:`pandora`,label:`Your part`,num:`23`},{id:`start`,label:`How we start`,num:`24`}]},{id:`faqC`,label:`FAQ`,sections:[{id:`faq`,label:`Customer FAQ`,num:`25`}]}],ef=$d.flatMap(e=>e.sections),tf={kicker:`Pandora TS&F · Strategic Partner Selection 2027 · The requested alternative`,headline:`Same destination. A gentler on-ramp.`,question:`We would like to know if you can propose an alternative approach to the scope provided, as we found the current approach to be a bit ambitious.`,attribution:`Your message after the platform deep-dive`,ownership:`Thank you — this is exactly the right challenge, and a welcome one. In the deep dive we showed you the destination but not the road to it, so it read as if we would do all of it from day one. We are grateful for the chance to show the opposite.`,lede:`Here is the road we did not show. We run your platforms as they run today — your tools, your processes, your SLAs, the RFP's own transition plan — from day one. The agentic fabric stays exactly where you liked it: the destination. Everything below is how we travel there, step by earned step, at your pace and only ever through gates you control.`,oneLiner:`The fabric is never a dependency — only a dividend.`},nf=[{tag:`Lane 1`,title:`Run & Deliver`,role:`lane`,body:`Day-one as-is takeover on the RFP's own transition plan, tooling and SLAs. Zero change imposed on Pandora teams. Every scope item has a named conventional delivery path.`},{tag:`Lane 2`,title:`Improve & Evolve`,role:`lane`,body:`The agentic fabric as the continuous-improvement engine. It touches the estate only after readiness gates pass — one scope item at a time, with Pandora holding every dial.`},{tag:`Under both, from day one`,title:`Governance`,role:`base`,body:`Service governance live from day one. Agentic governance pre-built but dormant until the first dial-up. Controls always arrive before autonomy.`}],rf=[[`Role of the agentic fabric`,`Delivery mechanism for scope`,`Continuous-improvement engine behind scope`],[`Scope coupling`,`13 of 30 scope rows delivered "via the fabric"`,`Zero scope rows depend on the fabric`],[`Day-1 change for Pandora teams`,`New Teams front door, new patterns`,`None — same tools, same processes`],[`Adoption decision`,`Program-level`,`Per scope item, per readiness gate, Pandora-held dial`],[`Governance on day 1`,`Agentic governance active`,`Service governance active; agentic governance dormant until first dial-up`],[`Prerequisites`,`Assumed ready`,`Assessed, then built inside Lane 1 — Gate 0 before anything agentic`],[`Benefits curve`,`Steeper, earlier`,`Slower start, same destination — the delta shown openly`]],af=`What does not change: the destination, the SLAs, the assets, the RFP commitments. The July approach remains available as the accelerated option — this alternative changes sequencing and coupling, nothing else.`,of=[`Lane 1 meets every SLA using conventional means alone. Nothing agentic is ever load-bearing for an SLA until after it has passed its gate.`,`Nothing crosses into the estate without a passed readiness gate, a named Pandora owner's sign-off, and a proven rollback.`,`Every dial-up is reversible, and every dial position is reviewed quarterly inside the existing governance cadence.`],sf=[{id:`lane1`,name:`Lane 1 · Run & Deliver`,detail:`Transition, operations, migrations and platform engineering on Pandora's own tools and SLAs — the RFP delivered as written.`},{id:`lane2`,name:`Lane 2 · Improve & Evolve`,detail:`The agentic fabric — Teams front door, agentic SDLC, agentic ops — held ready, entering per item only through gates and dials.`}],cf=`You just met the three gates. This is the one that needs building — Gate 0 — which is why it, and only it, gets a section of its own. Gates 1 and 2 stay where they were defined: short per-item checks you run at the moment you turn a dial.`,lf=`Before any agent acts in your estate, four things must already be true: the infrastructure and security posture can contain it, your people can supervise it, your operations can trace and measure it, and your governance can approve it. Lane 1 builds all four as a by-product of running the service well — which is why running as-is first is not a delay on the agentic journey. It is the journey's first leg.`,uf=`Agentic-first would not just have been ambitious — it would have been premature. The foundations must exist first, and most of them are already RFP scope.`,df=[{id:`infra`,title:`Infrastructure & security maturity`,why:`An agent is only as safe as the estate that contains it.`,assess:`Joint security posture review in months 1–3: secrets and Key Vault hygiene, RBAC and network policy, environment isolation, audit-sink coverage, LLM gateway readiness.`,build:`Close the found gaps inside Lane 1; stand up the LLM gateway with policy, logging and cost controls. AI-ready is not AI-running — and AI-ready infrastructure is one of your own stated goals, so this is paid-for scope, not overhead.`,evidence:`Security sign-off · gateway live with policy, logging and cost controls · audit sink proven end to end.`},{id:`people`,title:`People & AI-tool fluency`,why:`Agents need supervisors before they need autonomy.`,assess:`Skills baseline against the RFP's own named gaps (Kubernetes, Kafka, DevOps fundamentals) plus an AI-tool usage baseline across teams.`,build:`Copilot and Claude enablement — tools Pandora has already approved, and one of your own stated goals — with prompt literacy, training paths and champions seeded in delivery teams.`,evidence:`Adoption and proficiency thresholds met (weekly-active share, certified cohort) · first Pandora-run retro on AI-assisted work.`},{id:`ops`,title:`Operations: trace & measure`,why:`You cannot gate agents on evidence you cannot measure.`,assess:`Observability baseline: tracing coverage, SLO coverage, runbook coverage, MTTA/MTTD/MTTR measurability, alert quality.`,build:`Dashboards, SLOs and runbooks to 95%+ coverage; baselines banked — DORA, developer NPS (16), cost, ticket volumes — during transition.`,evidence:`Trace-and-measure capability demonstrated on live incidents for a full quarter before any agentic ops discussion.`},{id:`governance`,title:`Governance readiness`,why:`Autonomy without an approval model is just risk.`,assess:`Decision-rights map, audit completeness check, risk appetite per domain — agreed with Security and Risk in the room.`,build:`Risk-tier model (T0–T4), the gate charter authored by Pandora hands in workshop W2, and decision records as standard practice.`,evidence:`Charter signed by named Pandora owners · audit completeness at threshold across a quarter of Lane-1 operations.`}],ff={title:`Gate 0 — the foundations gate`,body:`Nothing agentic enters the estate until all four pillars show their evidence. Gate 0 is assessed jointly, passes once for the whole estate, and grants nothing automatically — it only makes dial-ups possible. It is the first of exactly three gate kinds: Gates 1 and 2 then pass per scope item. The dial stays in Pandora's hand.`},pf=[{id:`g0`,name:`Gate 0 · Foundations`,scope:`One-time · estate-wide`,unlocks:`Makes any dial-up possible at all`,evidence:`All four foundation pillars show their evidence: infra & security posture, people AI-fluency, ops trace-and-measure, governance readiness.`,where:`The one gate that asks us to build something — its evidence is the four readiness layers. Detailed in full in the next section.`},{id:`g1`,name:`Gate 1 · Assist`,scope:`Per item · lightweight check`,unlocks:`L0 → L1 for that item`,evidence:`Named Pandora owner · audit on for the flow · human-approval path proven · rollback demonstrated.`,where:`A per-item check — the evidence above is the whole of it. You run it when you dial an item up to L1.`},{id:`g2`,name:`Gate 2 · Agentic`,scope:`Per item · lightweight check`,unlocks:`L1 → L2 for that item`,evidence:`Assist track record at L1 · incident drill passed unaided · SLOs held · evaluation pass-rate at threshold.`,where:`A per-item check of the same shape — run only after that item has a proven track record at L1.`}],mf=`Are more gates coming? No. Three gate kinds is the whole system: Gate 0 passes once for the estate; Gates 1 and 2 pass per item. Every gate has a named owner, written evidence criteria, and a reversible outcome — and no calendar date ever substitutes for a gate.`,hf=`Notice the asymmetry: of the three gates, only Gate 0 asks us to build anything — the other two are short per-item checks whose evidence lists you have just read in full. That one build-something gate is the whole of the next section.`,gf=[[`Lane 1 · Run & Deliver`,`The as-is managed service: your tools, your SLAs, the RFP delivered as written. Active from day one, never dependent on Lane 2.`],[`Lane 2 · Improve & Evolve`,`The agentic fabric, held ready. Enters the estate only through gates, one scope item at a time.`],[`L0 · L1 · L2`,`The three service levels on every scope item: run as-is · AI-assisted (human executes) · agentic (bounded loop behind approvals).`],[`Gate 0 · 1 · 2`,`The three gate kinds: foundations (once, estate-wide) · assist gate (per item, unlocks L1) · agentic gate (per item, unlocks L2).`],[`The dial`,`Each scope item's level setting. All 30 start at L0; only Pandora turns a dial, and only after the gates for that move have passed.`],[`Dial review`,`The quarterly 30-minute agenda item in existing governance where every dial position is confirmed, changed — or explicitly kept at "not yet".`]],_f=`Before the detail, here is the whole model in motion. Follow one scope item as it travels — press "Turn the dial" to advance it one step, and watch who does what at each stage. Nothing moves without passing a gate, and Pandora turns every dial.`,vf=[{id:`pandora`,label:`Pandora`,role:`Owns the dial and approves every gate`,hue:`--tech`},{id:`ps`,label:`Publicis Sapient`,role:`Runs the service and proposes the gate evidence`,hue:`--accent`},{id:`ai`,label:`AI assist`,role:`Drafts and recommends — a human still executes`,hue:`--ops`},{id:`agent`,label:`Agent`,role:`Runs a bounded loop behind approval gates`,hue:`--proof`}],yf={name:`Gate 0 · Foundations`,tag:`one-time · estate-wide`,detail:`Underneath everything: before any item can move at all, the whole estate passes Gate 0 once — infrastructure & security, people, operations and governance are proven ready. Publicis Sapient proposes the evidence; Pandora approves. After that, items move one at a time.`},bf=[{id:`l0`,kind:`level`,tag:`L0`,lane:`Lane 1 · Run & Deliver`,title:`Level 0 — Run as-is`,who:`Publicis Sapient delivers the item conventionally, to your SLAs; your teams work exactly as they do today.`,move:`This is the default for all 30 items — an item stays here until you choose to turn its dial.`,actors:[`ps`]},{id:`g1`,kind:`gate`,tag:`Gate 1`,lane:`per item · the assist gate`,title:`Gate 1 — earn AI-assist`,who:`Publicis Sapient proposes the evidence: a named Pandora owner, audit switched on, a proven human-approval path, and rollback demonstrated. Pandora signs off and turns the dial.`,move:`Passing Gate 1 moves this one item from L0 to L1. It is reversible at any time.`,actors:[`ps`,`pandora`]},{id:`l1`,kind:`level`,tag:`L1`,lane:`Lane 2 · Improve & Evolve engaged`,title:`Level 1 — AI-assisted`,who:`AI drafts and recommends inside the flow; a human still reviews and executes every material action.`,move:`Faster and more consistent delivery — with a person firmly on the trigger.`,actors:[`ai`,`ps`]},{id:`g2`,kind:`gate`,tag:`Gate 2`,lane:`per item · the agentic gate`,title:`Gate 2 — earn autonomy`,who:`Publicis Sapient proposes the evidence: a proven L1 track record, an incident drill passed unaided, SLOs held, and evaluation pass-rate at threshold. Pandora signs off.`,move:`Passing Gate 2 moves this item from L1 to L2 — only after L1 has earned the trust.`,actors:[`ps`,`pandora`]},{id:`l2`,kind:`level`,tag:`L2`,lane:`Lane 2 · Improve & Evolve`,title:`Level 2 — Agentic`,who:`A bounded agent runs the loop behind approval gates; a human supervises and can stop or reverse it at any moment.`,move:`The destination for an item — governed autonomy, never unattended, always reversible.`,actors:[`agent`,`pandora`]}],xf=`Turn no dials and you still have a well-run service at L0 that hits every SLA. Turn any dial and it is pure upside — and every move is gated, reversible, and yours to make.`,Sf=[{phase:`Phase I · Support team`,window:`Days 0–60 · Nov–Dec 2026`,detail:`Full support team hired in; on-parallel shadow of current teams; knowledge acquisition and tooling; handling P3–P5. Bi-weekly readiness assessments throughout.`},{phase:`Phase I · Autonomous`,window:`Day 60+ · from late Dec 2026`,detail:`Full on-call rotation live; P1/P2 ownership; monthly on-call quality evaluation against SLA/SLO.`},{phase:`Phase II · Dev team`,window:`Days 60–120 · Jan–Feb 2027`,detail:`Full dev teams hired in; shadow; knowledge handover; feature development and system operation.`},{phase:`Phase II · Autonomous`,window:`Day 120+ · from Mar 2027`,detail:`Proficient in all dev/ops tasks; proactively lifting quality and delivery efficiency; monthly performance review. Cutover on a 50+ parameter readiness assessment, agreed jointly on evidence.`}],Cf=`Pandora's ask is specific: move DevOps, Data and Integration from the current vendor to self within a bounded transition window, without assuming the incumbent hands over everything. We make the running estate, not vendor documents, the source of truth.`,wf=[{value:`0-60`,label:`support takeover window`,detail:`L1/L2 moves only after access, on-call, P1/P2 routing and gap controls are proven.`},{value:`60-120`,label:`development takeover window`,detail:`Repos, release paths, fix routes and backlog ownership are proven through paired delivery.`},{value:`4 decisions`,label:`per component`,detail:`Transition now, transition with controls, hold/defer, or retire/migrate.`},{value:`50+`,label:`readiness checks`,detail:`Cutover is based on evidence across access, monitoring, documentation, restore, rollback and ownership.`}],Tf=[{bucket:`Transition now`,meaning:`Documented enough, access tested, monitoring live, owner known, restore path rehearsed.`,decision:`Move to autonomous support.`},{bucket:`Transition with controls`,meaning:`In scope but missing documentation, SME detail, observability, automation or dependency clarity.`,decision:`Take over with added monitoring, hypercare, named escalation and a dated gap plan.`},{bucket:`Hold / defer`,meaning:`Risk is too high to assume quietly: unknown critical path, missing access, unsafe rollback or unclear ownership.`,decision:`Escalate to governance; do not count as fully transitioned until the gate passes.`},{bucket:`Retire / migrate`,meaning:`The better answer is not long-term takeover but controlled migration, replacement or decommission.`,decision:`Move into the relevant migration factory or improvement backlog.`}],Ef=`No undocumented critical component becomes fully transitioned because time has passed. It passes readiness, moves with named controls, is held behind governance, or becomes a migration/retirement path.`,Df=[{label:`Tooling`,value:`Pandora's own table, unchanged: ServiceNow, New Relic, PagerDuty and GitHub (migrations in flight), Terraform, Jira/Confluence, Port.io.`},{label:`SLAs`,value:`The RFP's own numbers: P1 15-minute acknowledgement / 1.5h RTO · 99.99% mission-critical · error budgets per tier.`},{label:`RACI`,value:`The RFP boundary, unchanged: Pandora retains Lead and Senior Engineers, architecture, standards and roadmap; we run day-to-day.`},{label:`Migrations`,value:`Conventional migration factories: ADO→GitHub, OpsGenie→PagerDuty, Backstage→Port.io, and the BizTalk/EDW/Synapse strangler — playbooks, conversion tooling, cutover evidence.`},{label:`The only AI on day one`,value:`Inside our own delivery team (Claude, GitHub Copilot — tools Pandora already approved). It runs on our machines and pipelines, not in your estate, and needs no governance surface on your side.`}],Of=[{id:`people`,title:`People — as-is first`,points:[`Day-one staffing is conventional roles per the RFP's resource asks — Kafka, Databricks, Kong, Kubernetes, Terraform engineers; DevOps and JS profiles — through the proven talent model: selection panels, buddy onboarding, quarterly talent reviews.`,`Enablement targets the RFP's named gaps (Kubernetes, Kafka, DevOps fundamentals) — valuable regardless of any agentic future.`,`Agent-supervisor skills, champions and a CoE are introduced only as dials turn.`],message:`No Pandora engineer's job changes on day one. Capability grows by invitation.`},{id:`technology`,title:`Technology — as-is first`,points:[`Conventional automation first: runbooks, golden paths, IaC, dashboards — the unglamorous 80% of the value.`,`Migrations as factories, not agents — wave plans, conversion playbooks, cutover evidence.`,`The fabric sits on the shelf, already built and proven — Pandav on a standard container, skills-as-files in Git, zero net-new infrastructure. Keeping the option open costs nothing.`],message:`We are not asking you to fund an option. It already exists.`},{id:`ops`,title:`Operations — as-is first`,points:[`ITIL discipline on the RFP's SLAs, human on-call, MTTA/MTTD/MTTR measurement from day one.`,`Toil falls first through conventional automation; the trace-and-measure foundation (Gate 0, pillar three) is built here.`,`Agentic ops, if and when dialled, arrives read-only first, then drafted-RCA, then gated runbooks — each step behind its own gate.`],message:`SLAs are never hostage to novelty.`}],kf=[{id:`service`,name:`Layer 1 · Service governance`,sub:`active from day one`,state:`ACTIVE DAY 1`,items:[`Weekly delivery forum (delivery and engineering leads, both sides)`,`Monthly Engineering-Manager → vendor-manager performance feedback`,`Escalation paths and joint incident/problem management`,`Service reviews: reliability, adoption, developer experience, cost, improvement backlog`]},{id:`agentic`,name:`Layer 2 · Agentic governance`,sub:`pre-built, dormant until the first dial-up`,state:`DORMANT UNTIL DIAL-UP`,items:[`Agent registry, intent catalogue and model catalogue — prepared as templates during Lane-1 quarters`,`Risk-tiered autonomy model T0–T4 — action rights by risk, reversibility and environment`,`Full audit trail design: every request, context package, approval, tool call and output traceable`,`Evaluation scorecards and AI FinOps — activated with the first estate touch, never before`]}],Af=`The standing mechanism that joins the two layers: a quarterly dial review inside the existing monthly-governance cadence — every scope item's level, its evidence status, and any proposed change, decided by Pandora. Saying "not yet" carries zero consequence.`,jf=[{level:0,name:`Run as-is`,detail:`Conventional delivery, named solution, SLA-bound. The default — forever, if Pandora chooses.`},{level:1,name:`AI-assisted`,detail:`AI drafts and recommends inside the existing process; a human executes every action. No new estate infrastructure; audit on. Unlocked per item by Gate 1 (after Gate 0).`},{level:2,name:`Agentic`,detail:`The fabric owns a bounded loop behind approval gates. Unlocked per item by Gate 2 — never before a proven L1 track record.`}],Mf=[{id:`paks`,platform:`devops`,name:`PAKS: Kubernetes, self-service namespaces, provisioning`,sourceNo:1,deliveredBy:`PAKS, Teams agent, graph policy, Terraform/GitOps recipes`,scopeDesc:`Operate the shared AKS platform as namespace-as-a-service — onboarding, quotas, isolation and self-service provisioning.`,level0:`Operate AKS per the RFP operating model; namespace-as-a-service via Terraform/GitOps and ServiceNow requests; human fulfilment.`,level1:`Teams request front-door drafts the change; a human approves and applies.`,level1H:`Apr 2027`,level2:`Auto-provisioning within quota policy.`,level2H:`Oct 2027+`,targetNeedsLevel:0,goals:[`DevOps 01`]},{id:`paks-opmodel`,platform:`devops`,name:`Operating model for PAKS & portal`,sourceNo:2,deliveredBy:`Platform operating model, ServiceNow, SLOs, on-call workflows`,scopeDesc:`The service operating model for PAKS and the developer portal — ITIL operations, SLOs, 24/7 on-call and incident workflows.`,level0:`ITIL operations, ServiceNow, SLOs, human 24/7 on-call.`,level1:`AI triage summaries and runbook suggestions to the on-call human.`,level1H:`Apr 2027`,level2:`Agentic ops executes approved reversible runbooks.`,level2H:`Oct 2027+`,targetNeedsLevel:0},{id:`ado-github`,platform:`devops`,name:`ADO → GitHub foundation`,sourceNo:3,deliveredBy:`GitHub migration factory, repo/pipeline conversion skills`,scopeDesc:`Migrate source control and pipelines from Azure DevOps to GitHub, the foundation for a modern AI-assisted development workflow.`,level0:`Conventional migration factory: repo and pipeline conversion playbooks, wave plan, cutover evidence.`,level1:`Our team's AI-assisted pipeline conversion — internal to us, from day one.`,level1H:`internal, day 1`,level2:`n/a — one-time project.`,targetNeedsLevel:0,goals:[`DevOps 02`,`Migrations in flight`]},{id:`observability`,platform:`devops`,name:`End-to-end observability`,sourceNo:4,deliveredBy:`New Relic, SLO dashboards, alert triage, runbook automation`,scopeDesc:`Build end-to-end observability flows that show business processes at a glance across organizational domains and applications.`,level0:`New Relic dashboards, SLOs, alert routing, human triage, documented runbooks.`,level1:`AI-drafted RCA and alert-correlation summaries.`,level1H:`Apr–Oct 2027`,level2:`Agentic ops signal-to-runbook loop.`,level2H:`Oct 2027+`,targetNeedsLevel:0,goals:[`DevOps 03`]},{id:`devex-idp`,platform:`devops`,name:`DevEx & onboarding through a single IDP`,sourceNo:5,deliveredBy:`Developer portal, Teams front door, graph-backed access`,scopeDesc:`Cut developer friction with golden paths, self-service environments, fast feedback loops and a single internal developer portal.`,level0:`Port.io portal, golden-path docs, conventional joiner-mover-leaver process.`,level1:`Teams front-door assist for requests, human-approved.`,level1H:`Apr–Oct 2027`,level2:`Graph-backed automated access provisioning.`,level2H:`Oct 2027+`,targetNeedsLevel:1,goals:[`DevOps 04`]},{id:`helios-port`,platform:`devops`,name:`Helios → Port.io migration`,sourceNo:6,deliveredBy:`Port.io, catalog migration, scorecards, ownership graph`,scopeDesc:`Migrate the internal developer portal from Backstage (Helios) to Port.io — catalogue, scorecards and self-service actions.`,level0:`Conventional migration: catalogue, scorecards, integrations.`,level1:`Catalogue enrichment assisted (internal).`,level1H:`internal`,level2:`n/a — one-time project.`,targetNeedsLevel:0,goals:[`Migrations in flight`]},{id:`tool-decisions`,platform:`devops`,name:`Tool selection decisions`,sourceNo:7,deliveredBy:`Governance board, graph evidence, decision records`,scopeDesc:`Resolve open tooling decisions through a governance board — including code-quality and security scanning (Snyk vs GitHub Advanced Security).`,level0:`Governance board, structured decision records, evaluations (e.g. Snyk vs GitHub Advanced Security).`,level1:`Evidence packs auto-drafted from estate data.`,level1H:`Oct 2027`,level2:`n/a — decisions stay human.`,targetNeedsLevel:0,goals:[`Open decisions`]},{id:`opsgenie-pagerduty`,platform:`devops`,name:`OpsGenie → PagerDuty migration`,sourceNo:8,deliveredBy:`PagerDuty migration factory, on-call policy, incident workflows`,scopeDesc:`Migrate incident management from OpsGenie to PagerDuty — on-call policies, escalation and incident workflows.`,level0:`Conventional migration factory: on-call policies, escalation, incident workflows.`,level1:`—`,level2:`n/a — one-time project.`,targetNeedsLevel:0,goals:[`Migrations in flight`]},{id:`dora-nps`,platform:`devops`,name:`DORA & developer-NPS improvement`,sourceNo:9,deliveredBy:`DORA dashboards, agentic SDLC, DevEx measurement loop`,scopeDesc:`Improve delivery performance against DORA metrics and raise developer experience from the current NPS of 16.`,level0:`DORA dashboards, DevEx surveys, conventional improvement backlog.`,level1:`AI dev tooling for Pandora engineers — Copilot and Claude, already approved.`,level1H:`Jan–Apr 2027`,level2:`Agentic SDLC on CI.`,level2H:`Oct 2027+`,targetNeedsLevel:1,goals:[`DevOps 02`,`DevEx targets`]},{id:`transition-ci`,platform:`devops`,name:`Transition & continuous improvement`,sourceNo:10,deliveredBy:`Improvement backlog, ServiceNow evidence, improvement cadence`,scopeDesc:`Run the phased transition and a continuous-improvement backlog, proactively surfacing risks and opportunities.`,level0:`The RFP transition plan; monthly improve ehind them stands Sapient's senior thought leadership and CoE, specialists on call. That single accountable line never becomes a filter: Pandora keeps a standing, transparent line to every track lead in Data, DevOps and Ops — and we actively encourage you to use it.`,rp=[{area:`Direction & roadmap`,owner:`pandora`},{area:`Architecture`,owner:`pandora`},{area:`Standards`,owner:`pandora`},{area:`Gate 0 / 1 / 2 sign-off`,owner:`pandora`},{area:`Improvement backlog`,owner:`joint`},{area:`Day-to-day delivery`,owner:`sapient`},{area:`Operations & on-call`,owner:`sapient`}],ip=`Control is structural, not promised. Pandora retains Lead and Senior Engineers, architecture, standards and the roadmap; we run the day-to-day. Every gate and every dial-up needs a named Pandora owner's sign-off.`,ap=[{skill:`Data engineering`,t1:`Pipeline alerts, failed-run routing, first checks`,t2:`Rerun, quarantine, DQ triage, lineage lookup`,t3:`Spark / Delta fix PR, model and job optimisation`,improve:`Convert recurring fixes into auto-DQ triage, self-healing reruns and templates`,dev:`Data-product build, medallion design, reusable templates`},{skill:`Kafka / Confluent`,t1:`Lag, schema and connector alerts`,t2:`Replay, rebalance, connector restart, config triage`,t3:`Connector, schema or consumer fix PR`,improve:`Convert repeats into self-healing connectors and schema-drift automation`,dev:`Event contracts, producer / consumer engineering`},{skill:`DevOps / CI-CD`,t1:`Failed-build routing and known-error checks`,t2:`Runner, secret and pipeline recovery`,t3:`Workflow / action refactor PR, policy-gate fix`,improve:`Convert flaky builds into auto-remediation and policy-as-code improvements`,dev:`GitHub migration factory and platform pipeline patterns`},{skill:`Cloud · Kubernetes · Terraform`,t1:`Pod, node, quota and certificate monitoring`,t2:`Rollback, scale, config restore and access triage`,t3:`IaC, Helm or platform fix PR`,improve:`Convert incidents into self-heal, auto-scale and drift-correction patterns`,dev:`PAKS recipes, self-service patterns, platform engineering`},{skill:`SRE / Observability`,t1:`Alert intake, severity routing, dashboard checks`,t2:`Correlation, RCA draft, runbook-guided restore`,t3:`Instrumentation, SLO or reliability fix PR`,improve:`Convert operational noise into auto-RCA, alert reduction and SLO guards`,dev:`Observability-by-design and resilience engineering`},{skill:`QE / SDET`,t1:`Smoke-test results and release-health checks`,t2:`Regression triage, data-quality failure isolation`,t3:`Test-harness and quality-gate fix PR`,improve:`Convert escaped defects into self-maintaining tests and failure triage`,dev:`Automation strategy, contract tests, CI quality gates`}],op=`Read the matrix left to right: Ops L1 monitors, routes and captures patterns; Ops L2 diagnoses and restores; Ops L3 engineers the fix. Recurring L3 fixes then move into the Lane 2 Improve & Evolve backlog and the same senior engineers carry them into development, so production learning becomes permanent code, IaC, tests and runbooks.`,sp=[{label:`Ops L1`,detail:`Monitor, log & route`},{label:`Ops L2`,detail:`Diagnose & restore`},{label:`Ops L3`,detail:`Fix in code / IaC`},{label:`Improve & Evolve`,detail:`Toil into backlog`},{label:`Development`,detail:`Build & change`}],cp=`Improvement is fed by every tier, not only L3: L1 records repeat alerts and handoffs, L2 records repeated restore steps, and L3 records root-cause fixes. The Improve & Evolve backlog is where day-to-day operations becomes the improvement engine.`,lp={title:`L3, Improve & Evolve and Development are one pool`,detail:`The same senior engineering pool works L3 production fixes, Lane 2 improvement items and development backlog items. Incidents become pull requests, reusable recipes, tests, runbooks and prevention work.`,flow:[`Incident / request`,`Ops L1`,`Ops L2`,`Ops L3`,`Improve & Evolve`,`Development`,`Permanent fix / reusable pattern`]},up=[{step:`Acquire`,detail:`Parallel shadow across L1, L2, L3 and development; access, tooling and service maps`},{step:`Document`,detail:`Tiered runbooks, fix patterns, ADRs, architecture notes and one knowledge wiki`},{step:`Play back`,detail:`Reverse-shadow: we replay incidents, fixes and backlog conversion to Pandora SMEs`},{step:`Certify`,detail:`Role-based clinics and readiness checks for operate, restore, fix and build`},{step:`Own`,detail:`Pandora can operate, improve and extend anything delivered — the acceptance bar`}],dp=`Knowledge transfer is role-based and designed into the work: L1 learns the signals, L2 learns restoration, L3 learns fix patterns, and development learns how operational evidence changes the backlog. The same loop runs across Gurgaon, Bucharest and Copenhagen from one knowledge base, and doubles as Gate-0 AI-fluency readiness.`,fp=[{at:`Jan 2027`,label:`Ramp & stabilise`,detail:`Onboarding and transition reach a steady baseline`,tag:`Transition`},{at:`Apr 2027`,label:`AI-augmented delivery`,detail:`Our own team's AI tooling lifts throughput per engineer — no estate footprint`,tag:`Lane 1 · our AI`},{at:`Oct 2027`,label:`Dialled AI`,detail:`As you turn L1 dials, assisted flows raise platform-team throughput`,tag:`Lane 2 · your dials`},{at:`Oct 2028`,label:`Owned & optimised`,detail:`Reusable patterns and a Pandora-owned CoE; capacity high, our footprint narrowing`,tag:`Pandora-owned`}],pp=`More delivered, by a leaner and more stable team, an increasing share of it Pandora-owned — the opposite of bringing an army.`,mp=[`Pandora on the selection panels for key roles`,`Access and environments for onboarding`,`Protected time for enablement clinics`,`Named Pandora counterparts per track`],hp=`One accountable leader, one team across three locations, Pandora in control at every gate, capacity compounding, and ownership transferring — the delivery engine that makes the gentle path credible.`,gp=`Not two teams — one team, sequenced. The transition stabilises the running service (the support wave) before it takes on change (the dev wave); the destination is a single team that builds and runs. What makes that possible is the agentic dial itself: Level 2/3 operations removes the operational cognitive load that forced development and operations apart, so a build-minded engineer can own what they run without being a full-time ops specialist.`,_p=[{title:`A layered core, not uniform heroes`,detail:`An experienced SRE/DevOps backbone holds 24×7 and the hard incidents; development engineers take on-call for what they build, with agentic ops carrying the toil.`},{title:`Rotation & pairing`,detail:`Engineers rotate between development and operations, building the build-and-run mindset over the journey rather than hiring for it fully formed.`},{title:`Follow-the-sun — 24×7 by design`,detail:`Copenhagen, Bucharest and Gurgaon cover the clock, so no individual carries an unsustainable pager — and dialled agentic ops cuts the night wake-ups further.`},{title:`Select for mindset, enable the rest`,detail:`We screen for ownership and curiosity, then close skills through Gate-0 enablement — the same clinics that build capability build the mindset.`}],vp=`So the two-wave transition is the on-ramp to the one team the agentic capability makes possible — dialling up agentic ops is what collapses development and operations into a single agent-supervising team, without burning out the rare full-stack engineer.`;function K({id:e,num:t,title:n,className:r,children:i}){return(0,F.jsx)(`section`,{id:e,className:r,children:(0,F.jsxs)(`div`,{className:`wrap`,children:[(0,F.jsxs)(q,{className:`sec-head`,children:[(0,F.jsx)(`span`,{className:`sec-num`,children:t}),(0,F.jsx)(`h2`,{children:n})]}),i]})})}function q({children:e,className:t,delay:n=0}){let r=typeof window<`u`&&window.location.hash.length>1;return(0,F.jsx)(ud.div,{className:t,initial:!r&&{opacity:0,y:12},whileInView:{opacity:1,y:0},viewport:{once:!0,margin:`-60px`},transition:{delay:n},children:e})}function yp({quote:e,source:t}){ret ns`,href:`#foundations`},{label:`Governance`,href:`#governance`}]},{id:`vendor-no-handover`,category:`Transition`,question:`What if the outgoing vendor does not hand over everything or the transition turns hostile?`,answer:[`We treat incomplete handover as an expected transition risk, not as an exception. Missing artefacts become named transition gaps with an owner, evidence required, decision route and date.`,`The permitted decisions are controlled: transition now with compensating controls, hold until evidence is complete, reverse-engineer through a governed backlog or burst pool, or mark for migration/retirement if the legacy path is not worth preserving.`,`Where the gap needs specialist depth, we bring in Sapient SMEs as needed to close the evidence gap: Kafka schema and connector SMEs, Databricks/Power BI SMEs, DevOps platform SMEs, BizTalk SMEs or security/network SMEs. That gives the transition team access to depth without permanently over-staffing the run service.`],links:[{label:`Transition coverage`,href:`#transition-coverage`},{label:`Landscape map`,href:`#landscape`},{label:`Governance`,href:`#governance`},{label:`Commercials`,href:`#commercials`}]},{id:`onboarding-cost-process`,category:`Commercials`,question:`What is the onboarding cost and process?`,answer:[`Standard mobilisation is part of the transition model: access setup, KT plan, shadowing, reverse shadowing, runbook familiarisation, service-readiness checks and reporting cadence.`,`Exceptional reverse engineering is handled transparently. If undocumented BizTalk maps, Kafka schemas, pipelines, dashboards or platform dependencies need reconstruction, the work goes into a governed transition backlog or agreed burst-capacity pool rather than becoming hidden cost.`],links:[{label:`How we start`,href:`#start`},{label:`Transition coverage`,href:`#transition-coverage`},{label:`Commercial model`,href:`#commercials`}]},{id:`new-joiner-effectiveness`,category:`People`,question:`Does a new joiner become 100% effective immediately?`,answer:[`No. We should be explicit that people ramp through a readiness path. A practical pattern is Week 1 at 25-40%, Weeks 2-3 at 50-60%, Weeks 4-6 at 70-80%, and Weeks 6-8 approaching full effectiveness, depending on the technology and production criticality.`,`Critical ownership is not assigned just because someone has joined. The person shadows, reverse-shadows, handles supervised tickets and passes a readiness gate before independent ownership.`],links:[{label:`Skills & KT`,href:`#team-skills`},{label:`Capacity that compounds`,href:`#team-capacity`},{label:`Team convergence`,href:`#team-converge`}]},{id:`knowledge-retention`,category:`People`,question:`How do you retain talent and knowledge if people leave?`,answer:[`We do not operate the service as a dependency on named individuals. We use role ownership, primary and secondary owners, documented runbooks, ticket history, RCA patterns, decision logs, dashboards and known-error records.`,`Knowledge is captured into the operating system of the service. If one person leaves, the replacement inherits evidence, playbooks, context and backup ownership rather than starting from zero.`],links:[{label:`Skills & KT`,href:`#team-skills`},{label:`One team, three locations`,href:`#team-shape`},{label:`Governance`,href:`#governance`}]},{id:`skill-mobilisation`,category:`Capability`,question:`How fast can you get people across DevOps, Data, Kafka/Kong and BizTalk?`,answer:[`Indicatively, PM/product/delivery roles can usually mobilise in 1-2 weeks, DevOps and Data engineers in 2-4 weeks, Kafka/Kong engineers in 3-5 weeks, and BizTalk specialists in 4-6 weeks depending on seniority, onsite need and background checks.`,`For immediate gaps we use interim SMEs or burst capacity while permanent roles ramp. We should distinguish mobilisation speed from full production effectiveness; full ownership still requires onboarding and readiness evidence.`],links:[{label:`Team capacity`,href:`#team-capacity`},{label:`Skills & KT`,href:`#team-skills`},{label:`Commercials`,href:`#commercials`}]},{id:`enough-capability`,category:`Capability`,question:`Do you have enough people and capability across the scope?`,answer:[`The answer should not be a pile of CVs. We show a role-based capability model across Ops L1, Ops L2, Ops L3, Improve & Evolve, development interface and burst capacity, mapped to DevOps, Data, Integration and Legacy.`,`The customer ask calculator in Commercials lets us show the additional named capacity request separately from the steady run base, including DevOps, Databricks/Power BI, Kafka/Kong and BizTalk.`],links:[{label:`Skills & KT`,href:`#team-skills`},{label:`Staffing commercial model`,href:`#commercials`},{label:`Scope of work`,href:`#scope`},{label:`Your goals`,href:`#goals`}]},{id:`location-model`,category:`People`,question:`Why Gurgaon, Romania and Denmark?`,answer:[`Gurgaon gives scale, cost efficiency, senior engineering depth and extended coverage. Romania gives European time-zone overlap, strong engineering depth and continuity between India and Denmark. Denmark is used selectively for customer proximity, onsite governance, legacy/vendor coordination and high-context decisions.`,`The point is not to put every role in the cheapest or most expensive location. The point is to put the right work in the right place, then expose the location mix so the customer can see how it affects cost and coverage.`],links:[{label:`One team, three locations`,href:`#team-shape`},{label:`Commercial model`,href:`#commercials`},{label:`Governance`,href:`#governance`}]},{id:`competitive-pricing`,category:`Commercials`,question:`How will you match players like TCS or Infosys?`,answer:[`We should match them where the comparison is fair: scale roles, offshore delivery, transparent rate cards, volume discounts, service governance and predictable staffing. But we should not reduce the response to lowest-rate body-shopping.`,`Our commercial response is total cost of service: location blend, editable rate card, term discount, volume discount, productivity dividend, engineering credit bank, burst-capacity model and a declining run-cost curve as automation removes repeated work.`],links:[{label:`Commercial model`,href:`#commercials`},{label:`Cost of caution`,href:`#caution`},{label:`Capacity that compounds`,href:`#team-capacity`}]},{id:`differentiation`,category:`Proof`,question:`How do we differentiate the response beyond people and rates?`,answer:[`The differentiation is three-part: transition from an imperfect current state, enough capability to protect the run service, and proof that we have done comparable takeover work before.`,`That means the response should lead with how we take control without perfect handover, how the team model avoids single-person dependency, and which cases prove transition, documentation, reverse shadow and stabilisation outcomes.`],links:[{label:`Transition coverage`,href:`#transition-coverage`},{label:`Team skills`,href:`#team-skills`},{label:`Why this is low-risk`,href:`#proof`}]},{id:`case-proof`,category:`Proof`,question:`Where do we show cases where we have done this before?`,answer:[`Use the Proof section as the main evidence anchor, and connect it explicitly to the delivery cases we walked through during the presentation. The proof is not theoretical; it is based on cases where we have already delivered takeover, documentation rebuild, reverse shadow and stabilisation outcomes.`,`The current proof card captures the presented Pandora delivery evidence: 100% readiness criteria met, 95%+ documentation and runbooks generated, 90%+ tickets resolved independently in reverse shadow, and 97%+ SLA achievement during stabilisation.`,`For the customer conversation, each reference case should be explained as: starting point, scope, what gaps existed, what we rebuilt, what service outcomes improved and why it is relevant to Pandora's DevOps, Data, Integration and Legacy transition.`],links:[{label:`Why this is low-
