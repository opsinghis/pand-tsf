q0r14`}],[`path`,{d:`M21 12h-9`,key:`1o4lsq`}],[`path`,{d:`M21 19h-5`,key:`1rlt1p`}],[`path`,{d:`M21 5h-7`,key:`1oszz2`}],[`path`,{d:`M8 10v4`,key:`tgpxqk`}],[`path`,{d:`M8 12H3`,key:`a7s4jb`}]]),Od=`Pandora TS&F · The Alternative Approach`,kd=[{id:`h3`,months:`3 months`,short:`3 mo`,date:`Jan 2027`,stage:`Stabilise & assess`},{id:`h6`,months:`6 months`,short:`6 mo`,date:`Apr 2027`,stage:`Foundations proven`},{id:`h12`,months:`12 months`,short:`12 mo`,date:`Oct 2027`,stage:`Selective dial-ups`},{id:`h24`,months:`24 months`,short:`24 mo`,date:`Oct 2028`,stage:`Earned scale`}],Ad=[{id:`ask-heard`,label:`The Ask`,sections:[{id:`hero-anchor`,label:`What we heard`,num:`01`},{id:`changes`,label:`What changes vs July`,num:`02`}]},{id:`scopeC`,label:`The Scope`,sections:[{id:`scope`,label:`Your scope of work — 30 items`,num:`03`}]},{id:`model`,label:`The Model`,sections:[{id:`twolane`,label:`The two-lane model`,num:`04`},{id:`foundations`,label:`Gate 0 in depth — readiness foundations`,num:`05`},{id:`landscape`,label:`Know the landscape`,num:`06`}]},{id:`runasis`,label:`Run As-Is`,sections:[{id:`dayone`,label:`Day one: run as-is`,num:`07`},{id:`lanes-asis`,label:`People · Technology · Ops`,num:`08`},{id:`governance`,label:`Governance: two layers`,num:`09`}]},{id:`team`,label:`The Team`,sections:[{id:`team-shape`,label:`One team, three locations`,num:`10`},{id:`team-leader`,label:`One leader · Pandora in control`,num:`11`},{id:`team-converge`,label:`Why two teams? Dev & ops converge`,num:`12`},{id:`team-skills`,label:`Skills & knowledge transfer`,num:`13`},{id:`team-capacity`,label:`Capacity that compounds`,num:`14`}]},{id:`dial`,label:`The Dial`,sections:[{id:`dial-explorer`,label:`The 30-item dial`,num:`15`},{id:`walkthroughs`,label:`The dial in action`,num:`16`},{id:`goals`,label:`Your goals, covered`,num:`17`}]},{id:`journey`,label:`The Journey`,sections:[{id:`horizons`,label:`Horizons, re-anchored`,num:`18`},{id:`caution`,label:`The cost of caution`,num:`19`},{id:`proof`,label:`Why this is low-risk`,num:`20`},{id:`pandora`,label:`Your part`,num:`21`},{id:`start`,label:`How we start`,num:`22`}]}],jd=Ad.flatMap(e=>e.sections),Md={kicker:`Pandora TS&F · Strategic Partner Selection 2027 · The requested alternative`,headline:`Same destination. A gentler on-ramp.`,question:`We would like to know if you can propose an alternative approach to the scope provided, as we found the current approach to be a bit ambitious.`,attribution:`Your message after the platform deep-dive`,ownership:`Thank you — this is exactly the right challenge, and a welcome one. In the deep dive we showed you the destination but not the road to it, so it read as if we would do all of it from day one. We are grateful for the chance to show the opposite.`,lede:`Here is the road we did not show. We run your platforms as they run today — your tools, your processes, your SLAs, the RFP's own transition plan — from day one. The agentic fabric stays exactly where you liked it: the destination. Everything below is how we travel there, step by earned step, at your pace and only ever through gates you control.`,oneLiner:`The fabric is never a dependency — only a dividend.`},Nd=[{tag:`Lane 1`,title:`Run & Deliver`,role:`lane`,body:`Day-one as-is takeover on the RFP's own transition plan, tooling and SLAs. Zero change imposed on Pandora teams. Every scope item has a named conventional delivery path.`},{tag:`Lane 2`,title:`Improve & Evolve`,role:`lane`,body:`The agentic fabric as the continuous-improvement engine. It touches the estate only after readiness gates pass — one scope item at a time, with Pandora holding every dial.`},{tag:`Under both, from day one`,title:`Governance`,role:`base`,body:`Service governance live from day one. Agentic governance pre-built but dormant until the first dial-up. Controls always arrive before autonomy.`}],Q=[[`Role of the agentic fabric`,`Delivery mechanism for scope`,`Continuous-improvement engine behind scope`],[`Scope coupling`,`13 of 30 scope rows delivered "via the fabric"`,`Zero scope rows depend on the fabric`],[`Day-1 change for Pandora teams`,`New Teams front door, new patterns`,`None — same tools, same processes`],[`Adoption decision`,`Program-level`,`Per scope item, per readiness gate, Pandora-held dial`],[`Governance on day 1`,`Agentic governance active`,`Service governance active; agentic governance dormant until first dial-up`],[`Prerequisites`,`Assumed ready`,`Assessed, then built inside Lane 1 — Gate 0 before anything agentic`],[`Benefits curve`,`Steeper, earlier`,`Slower start, same destination — the delta shown openly`]],Pd=`What does not change: the destination, the SLAs, the assets, the RFP commitments. The July approach remains available as the accelerated option — this alternative changes sequencing and coupling, nothing else.`,Fd=[`Lane 1 meets every SLA using conventional means alone. Nothing agentic is ever load-bearing for an SLA until after it has passed its gate.`,`Nothing crosses into the estate without a passed readiness gate, a named Pandora owner's sign-off, and a proven rollback.`,`Every dial-up is reversible, and every dial position is reviewed quarterly inside the existing governance cadence.`],Id=[{id:`lane1`,name:`Lane 1 · Run & Deliver`,detail:`Transition, operations, migrations and platform engineering on Pandora's own tools and SLAs — the RFP delivered as written.`},{id:`lane2`,name:`Lane 2 · Improve & Evolve`,detail:`The agentic fabric — Teams front door, agentic SDLC, agentic ops — held ready, entering per item only through gates and dials.`}],Ld=`You just met the three gates. This is the one that needs building — Gate 0 — which is why it, and only it, gets a section of its own. Gates 1 and 2 stay where they were defined: short per-item checks you run at the moment you turn a dial.`,Rd=`Before any agent acts in your estate, four things must already be true: the infrastructure and security posture can contain it, your people can supervise it, your operations can trace and measure it, and your governance can approve it. Lane 1 builds all four as a by-product of running the service well — which is why running as-is first is not a delay on the agentic journey. It is the journey's first leg.`,zd=`Agentic-first would not just have been ambitious — it would have been premature. The foundations must exist first, and most of them are already RFP scope.`,Bd=[{id:`infra`,title:`Infrastructure & security maturity`,why:`An agent is only as safe as the estate that contains it.`,assess:`Joint security posture review in months 1–3: secrets and Key Vault hygiene, RBAC and network policy, environment isolation, audit-sink coverage, LLM gateway readiness.`,build:`Close the found gaps inside Lane 1; stand up the LLM gateway with policy, logging and cost controls. AI-ready is not AI-running — and AI-ready infrastructure is one of your own stated goals, so this is paid-for scope, not overhead.`,evidence:`Security sign-off · gateway live with policy, logging and cost controls · audit sink proven end to end.`},{id:`people`,title:`People & AI-tool fluency`,why:`Agents need supervisors before they need autonomy.`,assess:`Skills baseline against the RFP's own named gaps (Kubernetes, Kafka, DevOps fundamentals) plus an AI-tool usage baseline across teams.`,build:`Copilot and Claude enablement — tools Pandora has already approved, and one of your own stated goals — with prompt literacy, training paths and champions seeded in delivery teams.`,evidence:`Adoption and proficiency thresholds met (weekly-active share, certified cohort) · first Pandora-run retro on AI-assisted work.`},{id:`ops`,title:`Operations: trace & measure`,why:`You cannot gate agents on evidence you cannot measure.`,assess:`Observability baseline: tracing coverage, SLO coverage, runbook coverage, MTTA/MTTD/MTTR measurability, alert quality.`,build:`Dashboards, SLOs and runbooks to 95%+ coverage; baselines banked — DORA, developer NPS (16), cost, ticket volumes — during transition.`,evidence:`Trace-and-measure capability demonstrated on live incidents for a full quarter before any agentic ops discussion.`},{id:`governance`,title:`Governance readiness`,why:`Autonomy without an approval model is just risk.`,assess:`Decision-rights map, audit completeness check, risk appetite per domain — agreed with Security and Risk in the room.`,build:`Risk-tier model (T0–T4), the gate charter authored by Pandora hands in workshop W2, and decision records as standard practice.`,evidence:`Charter signed by named Pandora owners · audit completeness at threshold across a quarter of Lane-1 operations.`}],Vd={title:`Gate 0 — the foundations gate`,body:`Nothing agentic enters the estate until all four pillars show their evidence. Gate 0 is assessed jointly, passes once for the whole estate, and grants nothing automatically — it only makes dial-ups possible. It is the first of exactly three gate kinds: Gates 1 and 2 then pass per scope item. The dial stays in Pandora's hand.`},Hd=[{id:`g0`,name:`Gate 0 · Foundations`,scope:`One-time · estate-wide`,unlocks:`Makes any dial-up possible at all`,evidence:`All four foundation pillars show their evidence: infra & security posture, people AI-fluency, ops trace-and-measure, governance readiness.`,where:`The one gate that asks us to build something — its evidence is the four readiness layers. Detailed in full in the next section.`},{id:`g1`,name:`Gate 1 · Assist`,scope:`Per item · lightweight check`,unlocks:`L0 → L1 for that item`,evidence:`Named Pandora owner · audit on for the flow · human-approval path proven · rollback demonstrated.`,where:`A per-item check — the evidence above is the whole of it. You run it when you dial an item up to L1.`},{id:`g2`,name:`Gate 2 · Agentic`,scope:`Per item · lightweight check`,unlocks:`L1 → L2 for that item`,evidence:`Assist track record at L1 · incident drill passed unaided · SLOs held · evaluation pass-rate at threshold.`,where:`A per-item check of the same shape — run only after that item has a proven track record at L1.`}],Ud=`Are more gates coming? No. Three gate kinds is the whole system: Gate 0 passes once for the estate; Gates 1 and 2 pass per item. Every gate has a named owner, written evidence criteria, and a reversible outcome — and no calendar date ever substitutes for a gate.`,Wd=`Notice the asymmetry: of the three gates, only Gate 0 asks us to build anything — the other two are short per-item checks whose evidence lists you have just read in full. That one build-something gate is the whole of the next section.`,Gd=[[`Lane 1 · Run & Deliver`,`The as-is managed service: your tools, your SLAs, the RFP delivered as written. Active from day one, never dependent on Lane 2.`],[`Lane 2 · Improve & Evolve`,`The agentic fabric, held ready. Enters the estate only through gates, one scope item at a time.`],[`L0 · L1 · L2`,`The three service levels on every scope item: run as-is · AI-assisted (human executes) · agentic (bounded loop behind approvals).`],[`Gate 0 · 1 · 2`,`The three gate kinds: foundations (once, estate-wide) · assist gate (per item, unlocks L1) · agentic gate (per item, unlocks L2).`],[`The dial`,`Each scope item's level setting. All 30 start at L0; only Pandora turns a dial, and only after the gates for that move have passed.`],[`Dial review`,`The quarterly 30-minute agenda item in existing governance where every dial position is confirmed, changed — or explicitly kept at "not yet".`]],Kd=`Before the detail, here is the whole model in motion. Follow one scope item as it travels — press "Turn the dial" to advance it one step, and watch who does what at each stage. Nothing moves without passing a gate, and Pandora turns every dial.`,qd=[{id:`pandora`,label:`Pandora`,role:`Owns the dial and approves every gate`,hue:`--tech`},{id:`ps`,label:`Publicis Sapient`,role:`Runs the service and proposes the gate evidence`,hue:`--accent`},{id:`ai`,label:`AI assist`,role:`Drafts and recommends — a human still executes`,hue:`--ops`},{id:`agent`,label:`Agent`,role:`Runs a bounded loop behind approval gates`,hue:`--proof`}],Jd={name:`Gate 0 · Foundations`,tag:`one-time · estate-wide`,detail:`Underneath everything: before any item can move at all, the whole estate passes Gate 0 once — infrastructure & security, people, operations and governance are proven ready. Publicis Sapient proposes the evidence; Pandora approves. After that, items move one at a time.`},Yd=[{id:`l0`,kind:`level`,tag:`L0`,lane:`Lane 1 · Run & Deliver`,title:`Level 0 — Run as-is`,who:`Publicis Sapient delivers the item conventionally, to your SLAs; your teams work exactly as they do today.`,move:`This is the default for all 30 items — an item stays here until you choose to turn its dial.`,actors:[`ps`]},{id:`g1`,kind:`gate`,tag:`Gate 1`,lane:`per item · the assist gate`,title:`Gate 1 — earn AI-assist`,who:`Publicis Sapient proposes the evidence: a named Pandora owner, audit switched on, a proven human-approval path, and rollback demonstrated. Pandora signs off and turns the dial.`,move:`Passing Gate 1 moves this one item from L0 to L1. It is reversible at any time.`,actors:[`ps`,`pandora`]},{id:`l1`,kind:`level`,tag:`L1`,lane:`Lane 2 · Improve & Evolve engaged`,title:`Level 1 — AI-assisted`,who:`AI drafts and recommends inside the flow; a human still reviews and executes every material action.`,move:`Faster and more consistent delivery — with a person firmly on the trigger.`,actors:[`ai`,`ps`]},{id:`g2`,kind:`gate`,tag:`Gate 2`,lane:`per item · the agentic gate`,title:`Gate 2 — earn autonomy`,who:`Publicis Sapient proposes the evidence: a proven L1 track record, an incident drill passed unaided, SLOs held, and evaluation pass-rate at threshold. Pandora signs off.`,move:`Passing Gate 2 moves this item from L1 to L2 — only after L1 has earned the trust.`,actors:[`ps`,`pandora`]},{id:`l2`,kind:`level`,tag:`L2`,lane:`Lane 2 · Improve & Evolve`,title:`Level 2 — Agentic`,who:`A bounded agent runs the loop behind approval gates; a human supervises and can stop or reverse it at any moment.`,move:`The destination for an item — governed autonomy, never unattended, always reversible.`,actors:[`agent`,`pandora`]}],Xd=`Turn no dials and you still have a well-run service at L0 that hits every SLA. Turn any dial and it is pure upside — and every move is gated, reversible, and yours to make.`,Zd=[{phase:`Phase I · Support team`,window:`Days 0–60 · Nov–Dec 2026`,detail:`Full support team hired in; on-parallel shadow of current teams; knowledge acquisition and tooling; handling P3–P5. Bi-weekly readiness assessments throughout.`},{phase:`Phase I · Autonomous`,window:`Day 60+ · from late Dec 2026`,detail:`Full on-call rotation live; P1/P2 ownership; monthly on-call quality evaluation against SLA/SLO.`},{phase:`Phase II · Dev team`,window:`Days 60–120 · Jan–Feb 2027`,detail:`Full dev teams hired in; shadow; knowledge handover; feature development and system operation.`},{phase:`Phase II · Autonomous`,window:`Day 120+ · from Mar 2027`,detail:`Proficient in all dev/ops tasks; proactively lifting quality and delivery efficiency; monthly performance review. Cutover on a 50+ parameter readiness assessment, agreed jointly on evidence.`}],Qd=[{label:`Tooling`,value:`Pandora's own table, unchanged: ServiceNow, New Relic, PagerDuty and GitHub (migrations in flight), Terraform, Jira/Confluence, Port.io.`},{label:`SLAs`,value:`The RFP's own numbers: P1 15-minute acknowledgement / 1.5h RTO · 99.99% mission-critical · error budgets per tier.`},{label:`RACI`,value:`The RFP boundary, unchanged: Pandora retains Lead and Senior Engineers, architecture, standards and roadmap; we run day-to-day.`},{label:`Migrations`,value:`Conventional migration factories: ADO→GitHub, OpsGenie→PagerDuty, Backstage→Port.io, and the BizTalk/EDW/Synapse strangler — playbooks, conversion tooling, cutover evidence.`},{label:`The only AI on day one`,value:`Inside our own delivery team (Claude, GitHub Copilot — tools Pandora already approved). It runs on our machines and pipelines, not in your estate, and needs no governance surface on your side.`}],$d=[{id:`people`,title:`People — as-is first`,points:[`Day-one staffing is conventional roles per the RFP's resource asks — Kafka, Databricks, Kong, Kubernetes, Terraform engineers; DevOps and JS profiles — through the proven talent model: selection panels, buddy onboarding, quarterly talent reviews.`,`Enablement targets the RFP's named gaps (Kubernetes, Kafka, DevOps fundamentals) — valuable regardless of any agentic future.`,`Agent-supervisor skills, champions and a CoE are introduced only as dials turn.`],message:`No Pandora engineer's job changes on day one. Capability grows by invitation.`},{id:`technology`,title:`Technology — as-is first`,points:[`Conventional automation first: runbooks, golden paths, IaC, dashboards — the unglamorous 80% of the value.`,`Migrations as factories, not agents — wave plans, conversion playbooks, cutover evidence.`,`The fabric sits on the shelf, already built and proven — Pandav on a standard container, skills-as-files in Git, zero net-new infrastructure. Keeping the option open costs nothing.`],message:`We are not asking you to fund an option. It already exists.`},{id:`ops`,title:`Operations — as-is first`,points:[`ITIL discipline on the RFP's SLAs, human on-call, MTTA/MTTD/MTTR measurement from day one.`,`Toil falls first through conventional automation; the trace-and-measure foundation (Gate 0, pillar three) is built here.`,`Agentic ops, if and when dialled, arrives read-only first, then drafted-RCA, then gated runbooks — each step behind its own gate.`],message:`SLAs are never hostage to novelty.`}],ef=[{id:`service`,name:`Layer 1 · Service governance`,sub:`active from day one`,state:`ACTIVE DAY 1`,items:[`Weekly delivery forum (delivery and engineering leads, both sides)`,`Monthly Engineering-Manager → vendor-manager performance feedback`,`Escalation paths and joint incident/problem management`,`Service reviews: reliability, adoption, developer experience, cost, improvement backlog`]},{id:`agentic`,name:`Layer 2 · Agentic governance`,sub:`pre-built, dormant until the first dial-up`,state:`DORMANT UNTIL DIAL-UP`,items:[`Agent registry, intent catalogue and model catalogue — prepared as templates during Lane-1 quarters`,`Risk-tiered autonomy model T0–T4 — action rights by risk, reversibility and environment`,`Full audit trail design: every request, context package, approval, tool call and output traceable`,`Evaluation scorecards and AI FinOps — activated with the first estate touch, never before`]}],tf=`The standing mechanism that joins the two layers: a quarterly dial review inside the existing monthly-governance cadence — every scope item's level, its evidence status, and any proposed change, decided by Pandora. Saying "not yet" carries zero consequence.`,nf=[{level:0,name:`Run as-is`,detail:`Conventional delivery, named solution, SLA-bound. The default — forever, if Pandora chooses.`},{level:1,name:`AI-assisted`,detail:`AI drafts and recommends inside the existing process; a human executes every action. No new estate infrastructure; audit on. Unlocked per item by Gate 1 (after Gate 0).`},{level:2,name:`Agentic`,detail:`The fabric owns a bounded loop behind approval gates. Unlocked per item by Gate 2 — never before a proven L1 track record.`}],rf=[{id:`paks`,platform:`devops`,name:`PAKS: Kubernetes, self-service namespaces, provisioning`,sourceNo:1,deliveredBy:`PAKS, Teams agent, graph policy, Terraform/GitOps recipes`,scopeDesc:`Operate the shared AKS platform as namespace-as-a-service — onboarding, quotas, isolation and self-service provisioning.`,level0:`Operate AKS per the RFP operating model; namespace-as-a-service via Terraform/GitOps and ServiceNow requests; human fulfilment.`,level1:`Teams request front-door drafts the change; a human approves and applies.`,level1H:`Apr 2027`,level2:`Auto-provisioning within quota policy.`,level2H:`Oct 2027+`,targetNeedsLevel:0,goals:[`DevOps 01`]},{id:`paks-opmode ks become same-day`,metAt:1,horizon:`Apr–Oct 2027`,note:`Sub-hour needs assisted authoring; same-day is already a step-change.`},{ref:`Data 06`,goal:`Observe health & metrics; triage`,lane1:`New Relic + lineage dashboards; human triage per SLO`,metAt:0,horizon:`Jan–Apr 2027`},{ref:`Data 07`,goal:`Granular cost transparency + proactive cost alarms`,lane1:`Tagging, showback dashboards, threshold alarms`,metAt:0,horizon:`Apr 2027`},{ref:`Data 08`,goal:`Decommission EDW + Synapse; data-infra cost ~20% down`,lane1:`Migration factory + storage optimisation + decommission economics`,metAt:0,horizon:`Oct 2027–Oct 2028`,note:`Our internal AI conversion assist shortens the runway ~30–40% at no dial cost.`}],df=[{ref:`Integration 01`,goal:`Industry-leading standards — e2e automation, self-service`,lane1:`Standards, templates, CI enforcement, review discipline`,metAt:1,horizon:`Apr–Oct 2027`,note:`Automation and standards are Level 0; the full self-service clause is the Level-1 mile.`},{ref:`Integration 02`,goal:`Reliable real-time + relaxed-latency data mart`,lane1:`Kafka / Databricks / Delta engineering with SLOs`,metAt:0,horizon:`Oct 2027`},{ref:`Integration 03`,goal:`AI-ready infrastructure`,lane1:`LLM gateway + guardrails + connector patterns — prepared, not switched on`,metAt:0,horizon:`Apr–Oct 2027`,note:`The sharpest reframe: AI-ready ≠ AI-running. Readiness is delivered inside Lane 1; switching agents on stays behind your dial.`},{ref:`Integration 04`,goal:`No data loss + end-to-end lifecycle transparency`,lane1:`DQ reconciliation, lineage, observability`,metAt:0,horizon:`Apr–Oct 2027`},{ref:`Integration 05`,goal:`Data-quality enforcement on Kafka`,lane1:`Schema checks, DQ gates, quarantine patterns`,metAt:0,horizon:`Apr–Oct 2027`},{ref:`Integration 06`,goal:`Flexible Kafka ingestion`,lane1:`Streaming / micro-batch / event-driven templates`,metAt:0,horizon:`Apr 2027`},{ref:`Integration 07`,goal:`Kong API developer portal + API standardization`,lane1:`Kong portal, catalogue, ownership, design governance`,metAt:0,horizon:`Apr–Oct 2027`},{ref:`Integration 08`,goal:`Decommission BizTalk — while retaining operating competency`,lane1:`Strangler factory + staffed BizTalk competency through migration; the missing action plan & budget delivered in the first 90 days`,metAt:0,horizon:`Strangler Oct 2027 · retired Oct 2028`}],ff=[{ref:`DevOps 01`,goal:`Shared Kubernetes infrastructure — reduce duplication & overhead`,lane1:`Operate PAKS; consolidate other K8s setups onto it conventionally`,metAt:0,horizon:`Oct 2027–Oct 2028`},{ref:`DevOps 02`,goal:`Enable AI-assisted development tooling, incl. ADO→GitHub as foundation`,lane1:`ADO→GitHub = conventional factory; tooling enablement = Copilot/Claude rollout + training`,metAt:1,horizon:`Jan–Apr 2027`,note:`The pivotal row: this is an AI-adoption goal Pandora wrote themselves, on tools already approved. Even the cautious path includes Level 1 here — the dial is about pace, not permission.`},{ref:`DevOps 03`,goal:`End-to-end observability for business observability at scale`,lane1:`Cross-domain New Relic dashboards + SLO flows`,metAt:0,horizon:`Apr–Oct 2027`},{ref:`DevOps 04`,goal:`DevEx & onboarding: golden paths, self-service, fast feedback, single IDP`,lane1:`Port.io + golden paths + docs — onboarding days become a day`,metAt:1,horizon:`Apr–Oct 2027`,note:`Minutes-level onboarding and fast-feedback loops are the Level-1 mile.`}],pf=[`Your migration strategy maps entirely to Lane 1: strangler factories, the action plan and budget where none exists today, and the new production patterns (Flink, events-to-Databricks, Kafka connectors) as conventional engineering.`,`Your in-flight migrations (ADO→GitHub, OpsGenie→PagerDuty, Backstage→Port.io): all Level-0 migration factories.`,`Your open decisions — code-quality toolset, Snyk vs GHAS, and the agentic-workflow framework: resolved via the Level-0 governance board with decision records. And the agentic-workflow framework Pandora asked for is exactly th andora chose — the fabric fully available, never mandatory`,`Same destination as the July approach. Arrival by consent.`]}],hf=`An alternative that pretends caution is free would be marketing. Here is exactly what each RFP target needs — most are met conventionally; four need Level 1; none need Level 2.`,gf=[{target:`99.99% availability · P1–P4 SLAs`,l0:`✅ from month 3`,l1:`—`,l2:`—`},{target:`Workspace provisioning: days → hours`,l0:`✅`,l1:`—`,l2:`—`},{target:`Workspace < 30 minutes`,l0:`✗`,l1:`✅ Teams-assist path`,l2:`—`},{target:`Onboarding days → minutes`,l0:`✗ (days → a day)`,l1:`✅`,l2:`—`},{target:`Pipeline / dashboard setup < 1 hour`,l0:`Partial (templates reach same-day)`,l1:`✅`,l2:`—`},{target:`~20% data-infra cost reduction`,l0:`✅ majority (decommission + right-sizing)`,l1:`Remainder`,l2:`—`},{target:`DORA improvement`,l0:`Partial (CI/CD hygiene)`,l1:`✅ (AI dev tooling)`,l2:`Full potential`},{target:`Developer NPS up from 16`,l0:`Partial`,l1:`✅`,l2:`—`},{target:`BizTalk / EDW / Synapse decommission`,l0:`✅ (factories)`,l1:`Faster (~30–40% conversion assist)`,l2:`—`}],_f=`Three of your headline targets — sub-30-minute workspaces, minutes-level onboarding, top-quartile DORA — are Level-1 outcomes. The dial for those three is yours; Gate 0 and the item gates make turning it safe.`,vf={label:`Illustrative benefit curves — original approach vs this alternative`,note:`Slower start, same destination. The gap is the price of certainty — and it closes as dials turn.`},yf=[{chip:`Proven at Pandora`,stat:`100 / 95 / 90 / 97`,body:`Our transition record in other Pandora product lines: 100% readiness criteria met, 95%+ documentation and runbooks generated, 90%+ tickets resolved independently in reverse shadow, 97%+ SLA achievement during stabilization.`,viz:{type:`meters`,items:[{label:`Readiness criteria met`,value:100},{label:`Docs & runbooks generated`,value:95},{label:`Tickets resolved independently`,value:90},{label:`SLA in stabilization`,value:97}]}},{chip:`Already built`,stat:`0 R&D risk`,body:`The fabric is not a promise: Pandav runs on a standard container, the skill library is in production delivery use, the ops loop is designed. Keeping the option ready costs nothing.`,viz:{type:`ready`,items:[`Pandav runs on a standard container`,`Skill library in production use`,`Ops loop designed`]}},{chip:`Named coverage`,stat:`30 / 30`,body:`Every scope row has a named conventional solution at Level 0. Coverage never depends on anything novel.`,viz:{type:`meters`,items:[{label:`Scope items with a named Level-0 solution`,value:100}]}},{chip:`Goals covered`,stat:`12/16 + 3/4`,body:`Your Data, Integration and DevOps platform goals fully met at Level 0; the remainder at Level 1 — one of which is your own AI-tooling goal. Nothing requires Level 2.`,viz:{type:`meters`,items:[{label:`Data & Integration goals met at L0`,value:75},{label:`DevOps objectives met at L0`,value:75}]}}],bf=[`Transition access and environments — the RFP's own mobilisation needs, nothing more`,`Named service owners per platform`,`Monthly governance participation (the RFP's cadence)`,`A quarterly dial review — 30 minutes inside the existing cadence`,`Optional: the W1/W2 workshops to co-author the gate charter for later`,`Not needed to start: any agentic decision, any new tooling in your estate, any process change for your teams`],xf=[{when:`Week 0 · on award (30 Oct 2026)`,what:`Confirm transition start; mobilise Phase I support team per the RFP plan.`},{when:`Weeks 1–6 · parallel, optional`,what:`W1 "Align — the map" and W2 "Define the gates": preparing the option, not committing to it. Every artifact Pandora-owned.`},{when:`~Day 90 · Jan 2027`,what:`First quarterly dial review — the first moment any dial could turn, and equally the moment you can say "not yet" with zero consequence.`}],Sf=[[`The one decision`,`Approve the alternative approach and confirm the transition start date. That is the whole ask.`],[`What stays yours`,`The dials, the gates, and the pace. Every dial-up needs your named owner's signature; every dial position is reviewed quarterly; "not yet" is always a valid answer.`],[`What stays ready`,`The agentic fabric — built, proven, and waiting behind Gate 0. The July approach remains available as the accelerated option whenever you want it.`]],Cf=`Run as-is from day one. Build the foundations while we run. Earn every step toward agentic — at your pace, behind your gates, with your hand on the dial.`,wf=[`Pandora TS&F · Strategic Partner Selection 2027 · Data, Integration & DevOps Platforms — the alternative approach`,`Companion detail on request: full dial specifications · gate charter template · foundations assessment method · transition plan · the accelerated (July) option`],Tf=`The engine behind the plan: one team across three locations under a single accountable Sapient leader, with Pandora holding architecture, standards and every gate — and effective capacity that compounds each horizon rather than a rise in headcount.`,Ef=[{id:`copenhagen`,city:`Copenhagen`,kind:`Onsite · Pandora HQ`,role:`Leadership, liaison and trust — embedded with your leaders`,roles:[`Sapient Delivery Lead`,`Solution / Engineering lead`,`Rotating SMEs, 1–2× a year`],lane1:65},{id:`bucharest`,city:`Bucharest`,kind:`Nearshore · Romania`,role:`Timezone overlap with Copenhagen — senior engineering and fast feedback`,roles:[`Senior / lead engineers`,`QE / SDET`,`Delivery coordination`],lane1:80},{id:`gurgaon`,city:`Gurgaon`,kind:`Offshore · India`,role:`Engineering and 24/7 operations scale — the delivery backbone`,roles:[`Data · Kafka · DevOps · Cloud engineers`,`Development + Operations rotation`,`AgentOps skill authoring`],lane1:88}],Df=[{id:`data`,name:`Data & Integration`,dev:`Data · Kafka · Delta · Unity Catalog`,ops:`Streaming ops · DQ · lineage`},{id:`devops`,name:`DevOps & Cloud`,dev:`CI/CD · GitHub Actions · Terraform`,ops:`PAKS/AKS · SRE · 24/7 on-call`},{id:`agentops`,name:`AgentOps & Enablement`,dev:`Skills authoring · AI tooling`,ops:`Evaluations · AI FinOps · adoption`}],Of=`One Sapient Delivery Lead is accountable across all three tracks and both lanes — SLAs, throughput, capability transfer and the improvement backlog roll up to one person, pairing directly with your Delivery Lead and Engineering Manager. That single accountable line never becomes a filter: Pandora keeps a standing, transparent line to every track lead in Data, DevOps and Ops — and we actively encourage you to use it.`,kf=[{area:`Direction & roadmap`,owner:`pandora`},{area:`Architecture`,owner:`pandora`},{area:`Standards`,owner:`pandora`},{area:`Gate 0 / 1 / 2 sign-off`,owner:`pandora`},{area:`Improvement backlog`,owner:`joint`},{area:`Day-to-day delivery`,owner:`sapient`},{area:`Operations & on-call`,owner:`sapient`}],Af=`Control is structural, not promised. Pandora retains Lead and Senior Engineers, architecture, standards and the roadmap; we run the day-to-day. Every gate and every dial-up needs a named Pandora owner's sign-off.`,jf=[{skill:`Data engineering`,t1:`Pipeline alerts, failed-run routing, first checks`,t2:`Rerun, quarantine, DQ triage, lineage lookup`,t3:`Spark / Delta fix PR, model and job optimisation`,dev:`Data-product build, medallion design, reusable templates`},{skill:`Kafka / Confluent`,t1:`Lag, schema and connector alerts`,t2:`Replay, rebalance, connector restart, config triage`,t3:`Connector, schema or consumer fix PR`,dev:`Event contracts, producer / consumer engineering`},{skill:`DevOps / CI-CD`,t1:`Failed-build routing and known-error checks`,t2:`Runner, secret and pipeline recovery`,t3:`Workflow / action refactor PR, policy-gate fix`,dev:`GitHub migration factory and platform pipeline patterns`},{skill:`Cloud · Kubernetes · Terraform`,t1:`Pod, node, quota and certificate monitoring`,t2:`Rollback, scale, config restore and access triage`,t3:`IaC, Helm or platform fix PR`,dev:`PAKS recipes, self-service patterns, platform engineering`},{skill:`SRE / Observability`,t1:`Alert intake, severity routing, dashboard checks`,t2:`Correlation, RCA draft, runbook-guided restore`,t3:`Instrumentation, SLO or reliability fix PR`,dev:`Observability-by-design and resilience engineering`},{skill:`QE / SDET`,t1:`Smoke-test results and release-health checks`,t2:`Regression triage, data-quality failure isolation`,t3:`Test-harness and quality-gate fix PR`,dev:`Automation strategy, contract tests, CI quality gates`}],Mf=`Full coverage from day one across development and operations — with operations explicitly spanning L1 monitor-and-route, L2 diagnose-and-restore and L3 engineering fix. L3 is deliberately interchangeable with development for the same skill, so production learning turns into permanent code, IaC, tests and runbook improvements.`,Nf=[{label:`Ops L1`,detail:`Monitor & route`},{label:`Ops L2`,detail:`Diagnose & restore`},{label:`Ops L3`,detail:`Engineer fix`},{label:`Development`,detail:`Build & change`}],Pf={title:`L3 is not a support silo`,detail:`The same senior engineering pool works L3 production fixes and development backlog items. Incidents become pull requests, reusable recipes, tests, runbooks and prevention work.`,flow:[`Incident / request`,`Ops L1`,`Ops L2`,`Ops L3`,`Development`,`Permanent fix / reusable pattern`]},Ff=[{step:`Acquire`,detail:`On-parallel shadow of current teams; tooling and access`},{step:`Document`,detail:`Living runbooks, ADRs, architecture and a knowledge wiki`},{step:`Play back`,detail:`Reverse-shadow — we play knowledge back to your incumbent SMEs`},{step:`Certify`,detail:`Enablement clinics and certifications against readiness thresholds`},{step:`Own`,detail:`Pandora can operate any capability we deliver — the acceptance bar`}],If=`Knowledge transfer is a designed workstream, not a hope — flowing both ways and across all three locations off one knowledge base, so Gurgaon, Bucharest and Copenhagen operate identically. It doubles as Gate-0 AI-fluency readiness.`,Lf=[{at:`Jan 2027`,label:`Ramp & stabilise`,detail:`Onboarding and transition reach a steady baseline`},{at:`Apr 2027`,label:`AI-augmented delivery`,detail:`Our own team's AI tooling lifts throughput per engineer — no estate footprint`},{at:`Oct 2027`,label:`Dialled AI`,detail:`As you turn L1 dials, assisted flows raise platform-team throughput`},{at:`Oct 2028`,label:`Owned & optimised`,detail:`Reusable patterns and a Pandora-owned CoE; capacity high, our footprint narrowing`}],Rf=`More delivered, by a leaner and more stable team, an increasing share of it Pandora-owned — the opposite of bringing an army.`,zf=[`Pandora on the selection panels for key roles`,`Access and environments for onboarding`,`Protected time for enablement clinics`,`Named Pandora counterparts per track`],Bf=`One accountable leader, one team across three locations, Pandora in control at every gate, capacity compounding, and ownership transferring — the delivery engine that makes the gentle path credible.`,Vf=`Not two teams — one team, sequenced. The transition stabilises the running service (the support wave) before it takes on change (the dev wave); the destination is a single team that builds and runs. What makes that possible is the agentic dial itself: Level 2/3 operations removes the operational cognitive load that forced development and operations apart, so a build-minded engineer can own what they run without being a full-time ops specialist.`,Hf=[{title:`A layered core, not uniform heroes`,detail:`An experienced SRE/DevOps backbone holds 24×7 and the hard incidents; development engineers take on-call for what they build, with agentic ops carrying the toil.`},{title:`Rotation & pairing`,detail:`Engineers rotate between development and operations, building the build-and-run mindset over the journey rather than hiring for it fully formed.`},{title:`Follow-the-sun — 24×7 by design`,detail:`Copenhagen, Bucharest and Gurgaon cover the clock, so no individual carries an unsustainable pager — and dialled agentic ops cuts the night wake-ups further.`},{title:`Se
